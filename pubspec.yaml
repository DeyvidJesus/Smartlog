name: smartlife
description: "Sistema inteligente para monitoramento de logística e operações."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.0

  google_maps_flutter: ^2.12.3
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  http: ^1.2.0

  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  provider: ^6.1.5+1
  google_generative_ai: ^0.4.7
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/Smartlog.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Smartlog.png"